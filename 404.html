<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Loading requested page | DonutCat</title>
    <script>
        // Preserve the original requested route and hand it to the SPA bootstrap.
        (function () {
            const fullRoute = window.location.pathname + window.location.search + window.location.hash;
            const redirectTarget = '/?__route=' + encodeURIComponent(fullRoute);
            window.location.replace(redirectTarget);
        })();
    </script>
</head>
<body>
    <p>Loading the requested DonutCat page. <a href="/">Return home</a> if you are not redirected.</p>
</body>
</html>
