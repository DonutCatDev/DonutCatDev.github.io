<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DonutCat's Emporium</title>
    <meta id="meta-description" name="description" content="DonutCat's collection of Beyblade resources, foam-adjacent tools, and 3D-printing references.">
    <meta id="robots-meta" name="robots" content="index,follow">
    <meta name="theme-color" content="#003366">
    <meta property="og:type" content="website">
    <meta id="og-title" property="og:title" content="DonutCat's Emporium">
    <meta id="og-description" property="og:description" content="DonutCat's collection of Beyblade resources, foam-adjacent tools, and 3D-printing references.">
    <meta id="og-url" property="og:url" content="https://donutcat.org/">
    <meta property="og:image" content="https://donutcat.org/content/pictures/donutcat.png">
    <meta property="og:image:alt" content="DonutCat">
    <link id="canonical-link" rel="canonical" href="https://donutcat.org/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/content/pictures/donutcat.png">
    <link rel="stylesheet" href="/styles/main.css">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "DonutCat's Emporium",
            "url": "https://donutcat.org/",
            "description": "Beyblade resources, foam-adjacent tools, and 3D-printing references."
        }
    </script>
</head>
<body>
    <a class="skip-link" href="#app">Skip to main content</a>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <p class="site-title">
                    <a href="/" class="title-link">
                        <img src="/content/pictures/donutcat.png" alt="" class="title-icon" width="30" height="30">
                        <span>:3</span>
                    </a>
                </p>
            </div>
            <p class="header-tagline">DonutCat's nonsense and sometimes useful info emporium</p>
            <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
                <span class="nav-toggle-label">Menu</span>
            </button>
            <nav id="primary-navigation" class="navigation" aria-label="Primary navigation">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-dropdown">
                        <div class="nav-section-link">
                            <a href="/bey" class="nav-link">Bey</a>
                            <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="bey-dropdown" aria-label="Toggle Bey submenu">▾</button>
                        </div>
                        <ul class="dropdown-menu" id="bey-dropdown"></ul>
                    </li>
                    <li class="nav-dropdown">
                        <div class="nav-section-link">
                            <a href="/foam" class="nav-link">Foam</a>
                            <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="foam-dropdown" aria-label="Toggle Foam submenu">▾</button>
                        </div>
                        <ul class="dropdown-menu" id="foam-dropdown"></ul>
                    </li>
                    <li class="nav-dropdown">
                        <div class="nav-section-link">
                            <a href="/printing" class="nav-link">Printing</a>
                            <button class="submenu-toggle" type="button" aria-expanded="false" aria-controls="printing-dropdown" aria-label="Toggle Printing submenu">▾</button>
                        </div>
                        <ul class="dropdown-menu" id="printing-dropdown"></ul>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="app" class="app-container"></main>
    <div id="route-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <noscript>
        <section class="noscript-message">
            <h1>JavaScript is required for the interactive site</h1>
            <p>You can still open the main resource sections: <a href="/bey">Bey</a>, <a href="/foam">Foam</a>, and <a href="/printing">Printing</a>.</p>
        </section>
    </noscript>

    <footer class="footer">
        <div class="footer-content">
            <p>Image credit to Lunko, thanks for enabling my shitposting</p>
        </div>
    </footer>

    <template id="home-page">
        <section class="page home-page">
            <h1 class="visually-hidden">DonutCat's Emporium</h1>
            <div class="page-content">
                <img src="/content/pictures/donutcat.png" alt="DonutCat" class="page-image" width="315" height="337">
            </div>
        </section>
    </template>

    <template id="bey-page">
        <section class="page bey-page">
            <div class="page-header">
                <h1>Beyblade activities and resources</h1>
            </div>
            <div class="page-content"><div class="project-grid"></div></div>
        </section>
    </template>

    <template id="foam-page">
        <section class="page foam-page">
            <div class="page-header">
                <h1>Foam-adjacent notable feats</h1>
            </div>
            <div class="page-content"><div class="project-grid"></div></div>
        </section>
    </template>

    <template id="printing-page">
        <section class="page printing-page">
            <div class="page-header">
                <h1>3D-printing resources</h1>
            </div>
            <div class="page-content"><div class="project-grid"></div></div>
        </section>
    </template>

    <script type="module" src="/scripts/app.js"></script>
</body>
</html>
